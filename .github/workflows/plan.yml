name: Terraform Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  id-token: write       # OIDC token
  contents: read        # checkout
  pull-requests: write  # post plan as PR comment

env:
  AWS_REGION: us-east-1
  TF_VERSION: "~> 1.5"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # continue-on-error so we can always post the comment, even on plan failure
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee /tmp/plan.txt
        continue-on-error: true

      - name: Parse plan summary
        if: always()
        run: |
          set +e
          totals=$(grep "^Plan:" /tmp/plan.txt || echo "No changes detected.")

          extract() { grep -E "^\s+# .+$1" /tmp/plan.txt | sed "s/^\s*# //;s/ $1//" | sort; }
          added=$(extract "will be created")
          changed=$(extract "will be updated in-place")
          replaced=$(extract "must be replaced")
          destroyed=$(extract "will be destroyed")

          fmt_section() {
            local label="$1" items="$2"
            [ -z "$items" ] && return
            local count; count=$(echo "$items" | wc -l | tr -d ' ')
            echo "**${label} (${count})**"
            echo "$items" | sed 's/^/  /'
            echo ""
          }

          {
            echo "$totals"
            echo ""
            fmt_section "+ Add"     "$added"
            fmt_section "~ Change"  "$changed"
            fmt_section "! Replace" "$replaced"
            fmt_section "- Destroy" "$destroyed"
          } > /tmp/plan_summary.txt

      # Finds an existing bot comment and updates it, or creates a new one.
      # Keeps the PR timeline clean on repeated pushes.
      - name: Post plan to PR comment
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const fs      = require('fs');
            const raw     = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const summary = fs.existsSync('/tmp/plan_summary.txt')
              ? fs.readFileSync('/tmp/plan_summary.txt', 'utf8').trim()
              : '';
            const MAX  = 60000;
            const plan = raw.length > MAX
              ? raw.slice(0, MAX) + '\n\n... output truncated (> 60k chars) ...'
              : raw;

            const outcome = '${{ steps.plan.outcome }}';
            const icon    = outcome === 'success' ? '✅' : '❌';
            const branch  = '${{ github.head_ref }}';

            const body = [
              '<!-- terraform-plan-comment -->',
              `#### ${icon} Terraform Plan — \`${branch}\``,
              '',
              summary,
              '',
              '<details><summary>Show full plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `> **Status:** \`${outcome}\` · pushed by @${{ github.actor }}`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.body.includes('<!-- terraform-plan-comment -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Write plan to job summary
        run: |
          echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```hcl' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Fail the check after posting the comment so reviewers see the output
      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
