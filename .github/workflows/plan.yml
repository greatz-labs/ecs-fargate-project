name: Terraform Plan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  id-token: write       # OIDC token
  contents: read        # checkout
  pull-requests: write  # post plan as PR comment

env:
  AWS_REGION: us-east-1
  TF_VERSION: "~> 1.5"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      # Scans Terraform for misconfigs before planning.
      # Skips below are documented trade-offs — add a reason for any new entry:
      #
      # Lab cost (would require paid AWS features):
      #   CKV_AWS_158 — CloudWatch log encryption requires KMS CMK
      #   CKV_AWS_136 — ECR KMS CMK encryption
      #   CKV2_AWS_28 — WAF on public ALB
      #
      # Architectural requirements (cannot be changed without breaking the design):
      #   CKV_AWS_382 — Open egress on SGs: ALB→tasks + tasks→ECR/CW/SSM
      #   CKV_AWS_260 — Port 80 ingress on ALB: internet-facing by design
      #   CKV_AWS_130 — Public subnets auto-assign IPs: required for ALB and NAT GW
      #   CKV_AWS_378 — HTTP target group: ALB→container traffic is internal HTTP only
      #   CKV_AWS_103 — TLS on HTTP listener: HTTP listener is a 301 redirect, no TLS
      #   CKV2_AWS_20 — HTTP→HTTPS redirect: requires certificate_arn (not set in lab)
      #
      # Lab/non-production trade-offs:
      #   CKV_AWS_150 — ALB deletion protection disabled (needed for terraform destroy)
      #   CKV_AWS_131 — ALB drop invalid HTTP headers (HTTP-only lab endpoint)
      #   CKV_AWS_21  — S3 versioning on alb-logs bucket (logs don't benefit from versioning)
      #   CKV_AWS_18  — S3 access logging on alb-logs bucket (avoids recursive logging)
      #   CKV_AWS_144 — S3 cross-region replication
      #   CKV_AWS_145 — S3 KMS encryption — SSE-S3 sufficient for access logs
      #   CKV2_AWS_62 — S3 event notifications
      #
      # Terraform CI/CD role — broad permissions are intentional for an infrastructure provisioner:
      #   CKV_AWS_290 — Write access without resource constraint (Terraform needs iam/ecs/ecr/etc)
      #   CKV_AWS_355 — * resource for restrictable actions (same)
      #   CKV_AWS_287 — Credentials exposure (iam:GetRole etc needed by Terraform)
      #   CKV_AWS_286 — Privilege escalation (Terraform needs iam:PassRole scoped to project)
      #   CKV_AWS_289 — Permissions management (Terraform manages IAM for this project)
      - name: Checkov IaC scan
        id: checkov
        run: |
          pip install checkov --quiet
          checkov -d . --framework terraform --compact \
            --skip-check CKV_AWS_158,CKV_AWS_136,CKV2_AWS_28,CKV_AWS_382,CKV_AWS_260,CKV_AWS_130,CKV_AWS_378,CKV_AWS_103,CKV2_AWS_20,CKV_AWS_150,CKV_AWS_131,CKV_AWS_21,CKV_AWS_18,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62,CKV_AWS_290,CKV_AWS_355,CKV_AWS_287,CKV_AWS_286,CKV_AWS_289
        continue-on-error: true

      # continue-on-error so we can always post the comment, even on plan failure
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee /tmp/plan.txt
        continue-on-error: true

      - name: Parse plan summary
        if: always()
        run: |
          set +e
          totals=$(grep "^Plan:" /tmp/plan.txt || echo "No changes detected.")

          extract() { grep -E "^\s+# .+$1" /tmp/plan.txt | sed "s/^\s*# //;s/ $1//" | sort; }
          added=$(extract "will be created")
          changed=$(extract "will be updated in-place")
          replaced=$(extract "must be replaced")
          destroyed=$(extract "will be destroyed")

          fmt_section() {
            local label="$1" items="$2"
            [ -z "$items" ] && return
            local count; count=$(echo "$items" | wc -l | tr -d ' ')
            echo "**${label} (${count})**"
            echo "$items" | sed 's/^/  /'
            echo ""
          }

          {
            echo "$totals"
            echo ""
            fmt_section "+ Add"     "$added"
            fmt_section "~ Change"  "$changed"
            fmt_section "! Replace" "$replaced"
            fmt_section "- Destroy" "$destroyed"
          } > /tmp/plan_summary.txt

      # Finds an existing bot comment and updates it, or creates a new one.
      # Keeps the PR timeline clean on repeated pushes.
      - name: Post plan to PR comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const fs      = require('fs');
            const raw     = fs.readFileSync('/tmp/plan.txt', 'utf8');
            const summary = fs.existsSync('/tmp/plan_summary.txt')
              ? fs.readFileSync('/tmp/plan_summary.txt', 'utf8').trim()
              : '';
            const MAX  = 60000;
            const plan = raw.length > MAX
              ? raw.slice(0, MAX) + '\n\n... output truncated (> 60k chars) ...'
              : raw;

            const outcome = '${{ steps.plan.outcome }}';
            const icon    = outcome === 'success' ? '✅' : '❌';
            const branch  = '${{ github.head_ref }}';

            const body = [
              '<!-- terraform-plan-comment -->',
              `#### ${icon} Terraform Plan — \`${branch}\``,
              '',
              summary,
              '',
              '<details><summary>Show full plan output</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '',
              '</details>',
              '',
              `> **Status:** \`${outcome}\` · pushed by @${{ github.actor }}`
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find(c =>
              c.body.includes('<!-- terraform-plan-comment -->')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

      - name: Write plan to job summary
        run: |
          echo '### Terraform Plan' >> "$GITHUB_STEP_SUMMARY"
          echo '```hcl' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any check failed
        if: |
          steps.checkov.outcome == 'failure' ||
          steps.plan.outcome    == 'failure'
        run: exit 1
